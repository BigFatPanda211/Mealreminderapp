# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line, check the documentation for more details about this.
# For more details on how to configure your build environment visit
# http://www.gradle.org/guide/tasks/configuring-gradle

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for headless machines.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/guide/performance-tuning/configuration-on-demand
# org.gradle.parallel=true

# AndroidX package structure to make it compatible with older versions of Android API
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Version of gradle to use
#org.gradle.java.home=/path/to/jdk

# Minimum version of gradle
gradle.version=7.6.3

# Enable new gradle model
org.gradle.unsafe.experimental.android.m2IncompatibilityEnabled=true
